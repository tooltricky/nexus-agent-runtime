openapi: 3.1.0
info:
  title: Nexus Agent Runtime API
  version: 0.2.0
  description: >-
    Contract revision 0.2 for the existing /v1 API. Run and timeline GET responses
    identify this revision with Nexus-API-Contract: 0.2. Clients must upgrade before
    cancellation is enabled in B05. This revision does not expose a cancel operation.
servers:
  - url: http://localhost:8080
paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a Session
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /v1/runs:
    post:
      operationId: createRun
      summary: Create an asynchronous Run and its fixed Task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
            example:
              session_id: ses_19f9c46d-988c-4692-bbd0-854fb1bf0771
              input: 分析订单服务错误率
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "202":
          description: Run accepted, or the original Run for this idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The idempotency key was reused for a different request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
  /v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      summary: Get current Run and Task state
      responses:
        "200":
          description: Current Run state
          headers:
            Nexus-API-Contract:
              description: Explicit representation revision; no legacy negotiation is supported.
              required: true
              schema:
                const: "0.2"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run_id}/timeline:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRunTimeline
      summary: Get the ordered immutable domain-event timeline
      responses:
        "200":
          description: Events ordered by their database sequence
          headers:
            Nexus-API-Contract:
              description: Explicit representation revision; no legacy negotiation is supported.
              required: true
              schema:
                const: "0.2"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '[^\x00-\x20]'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Missing/blank/overlong Idempotency-Key, missing/blank fields, or unreadable JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidRequestError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
  schemas:
    Session:
      type: object
      required: [session_id, created_at]
      properties:
        session_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreateRunRequest:
      type: object
      description: Unknown fields are accepted and ignored, including for idempotency comparison. Strings are not trimmed.
      additionalProperties: true
      required: [session_id, input]
      properties:
        session_id:
          type: string
          minLength: 1
          pattern: '[^\x00-\x20]'
        input:
          type: string
          minLength: 1
          pattern: '[^\x00-\x20]'
    AcceptedRun:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
    RunStatus:
      type: string
      enum: [CREATED, QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    TaskStatus:
      type: string
      enum: [PENDING, LEASED, EXECUTING, RETRYING, SUCCEEDED, FAILED, CANCELLED]
    Task:
      type: object
      required: [task_id, name, status, input, attempt, max_attempts, next_attempt_at, created_at, updated_at]
      allOf:
        - if:
            properties:
              status:
                const: SUCCEEDED
          then:
            required: [output]
          else:
            properties:
              output: false
        - if:
            properties:
              status:
                enum: [LEASED, EXECUTING]
          then:
            required: [lease_owner, lease_expires_at]
          else:
            properties:
              lease_owner: false
              lease_expires_at: false
        - if:
            properties:
              status:
                const: CANCELLED
          then:
            not:
              anyOf:
                - required: [output]
                - required: [lease_owner]
                - required: [lease_expires_at]
      properties:
        task_id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        input:
          type: object
          required: [input]
          properties:
            input:
              type: string
        output:
          description: Omitted until success; never null.
          $ref: "#/components/schemas/Output"
        lease_owner:
          description: Present only while LEASED or EXECUTING; otherwise omitted, never null.
          type: string
        lease_expires_at:
          type: string
          format: date-time
        attempt:
          description: Total lease claims, including the initial attempt.
          type: integer
          minimum: 0
        max_attempts:
          description: Maximum total attempts, including the initial attempt (default 3).
          type: integer
          minimum: 1
        next_attempt_at:
          description: Always present. A RETRYING Task cannot be leased before this time.
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Run:
      type: object
      required: [run_id, session_id, input, status, tasks, created_at, updated_at]
      allOf:
        - if:
            properties:
              status:
                const: SUCCEEDED
          then:
            required: [output]
          else:
            properties:
              output: false
        - if:
            properties:
              status:
                const: CANCELLED
          then:
            not:
              required: [output]
      properties:
        run_id:
          type: string
        session_id:
          type: string
        input:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        output:
          description: Omitted until success; never null.
          $ref: "#/components/schemas/Output"
        tasks:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/Task"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Output:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
    DomainEvent:
      description: Absent schema_version selects legacy 0.1; explicit 0.2 selects the new schema; all other versions are rejected.
      if:
        required: [schema_version]
      then:
        $ref: "./events/domain-event-v0.2.schema.json"
      else:
        $ref: "./events/domain-event.schema.json"
    Timeline:
      type: object
      required: [run_id, events]
      properties:
        run_id:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/DomainEvent"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, not_found, idempotency_conflict]
        message:
          type: string
    InvalidRequestError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            code:
              const: invalid_request
    NotFoundError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            code:
              const: not_found
    ConflictError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            code:
              const: idempotency_conflict
