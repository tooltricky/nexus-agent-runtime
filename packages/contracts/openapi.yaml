openapi: 3.1.0
info:
  title: Nexus Agent Runtime API
  version: 0.1.0
  description: MVP Control Plane API for the Session, Run, Task, and event lifecycle.
servers:
  - url: http://localhost:8080
paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a Session
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /v1/runs:
    post:
      operationId: createRun
      summary: Create an asynchronous Run and its fixed Task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
            example:
              session_id: ses_19f9c46d-988c-4692-bbd0-854fb1bf0771
              input: 分析订单服务错误率
      responses:
        "202":
          description: Run accepted, or the original Run for this idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The idempotency key was reused for a different request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      summary: Get current Run and Task state
      responses:
        "200":
          description: Current Run state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run_id}/timeline:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRunTimeline
      summary: Get the ordered immutable domain-event timeline
      responses:
        "200":
          description: Events ordered by their database sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Session:
      type: object
      required: [session_id, created_at]
      properties:
        session_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [session_id, input]
      properties:
        session_id:
          type: string
          minLength: 1
        input:
          type: string
          minLength: 1
    AcceptedRun:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
    RunStatus:
      type: string
      enum: [CREATED, QUEUED, RUNNING, SUCCEEDED, FAILED]
    TaskStatus:
      type: string
      enum: [PENDING, LEASED, EXECUTING, SUCCEEDED, FAILED]
    Task:
      type: object
      required: [task_id, name, status, input, created_at, updated_at]
      properties:
        task_id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        input:
          type: object
        output:
          type: object
          properties:
            summary:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Run:
      type: object
      required: [run_id, session_id, input, status, tasks, created_at, updated_at]
      properties:
        run_id:
          type: string
        session_id:
          type: string
        input:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        output:
          type: object
          properties:
            summary:
              type: string
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DomainEvent:
      type: object
      required: [sequence, event_id, aggregate_type, aggregate_id, run_id, event_type, payload, occurred_at]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        event_id:
          type: string
        aggregate_type:
          type: string
          enum: [RUN, TASK]
        aggregate_id:
          type: string
        run_id:
          type: string
        task_id:
          type: string
        event_type:
          type: string
        payload:
          type: object
        occurred_at:
          type: string
          format: date-time
    Timeline:
      type: object
      required: [run_id, events]
      properties:
        run_id:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/DomainEvent"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
