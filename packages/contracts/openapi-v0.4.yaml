openapi: 3.1.0
info:
  title: Nexus Agent Runtime API
  version: 0.4.0
  description: >-
    Contract revision 0.4 for the /v1 API. Successful Run/timeline GET and cancel/pause/resume POST
    responses identify this revision with Nexus-API-Contract: 0.4. Clients must
    understand PAUSED and mixed 0.1/0.2/0.3/0.4 event versions before pause/resume is enabled.
servers:
  - url: http://localhost:8080
paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a Session
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /v1/runs:
    post:
      operationId: createRun
      summary: Create an asynchronous Run and its fixed Task
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
            example:
              session_id: ses_19f9c46d-988c-4692-bbd0-854fb1bf0771
              input: 分析订单服务错误率
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "202":
          description: Run accepted, or the original Run for this idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedRun"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The idempotency key was reused for a different request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
  /v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      summary: Get current Run and Task state
      responses:
        "200":
          description: Current Run state
          headers:
            Nexus-API-Contract:
              description: Explicit representation revision; no legacy negotiation is supported.
              required: true
              schema:
                const: "0.4"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: cancelRun
      summary: Atomically cancel a Run and its unfinished Task
      description: >-
        No request body or Idempotency-Key is required; the body is ignored. Cancels
        QUEUED/RUNNING/PAUSED Runs, including leased, executing, and retrying Tasks.
        Repeating cancellation succeeds without changing state or appending events.
        Completed Runs reject cancellation. If expiry is discovered here, TIMEOUT
        is committed before returning 409. Locked eligibility checks before deadline
        may commit later; after deadline unfinished work must time out. Cancellation may wait
        for an executing transaction and does not undo external side effects or
        promise immediate interruption.
      responses:
        "200":
          description: Cancelled Run, including an already cancelled Run
          headers:
            Nexus-API-Contract:
              description: Explicit representation revision; no legacy negotiation is supported.
              required: true
              schema:
                const: "0.4"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Run"
                  - properties:
                      status:
                        const: CANCELLED
                      tasks:
                        items:
                          properties:
                            status:
                              const: CANCELLED
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Run succeeded, failed or timed out; a newly discovered expiry commits TIMEOUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationConflictError"
  /v1/runs/{run_id}/pause:
    parameters:
    - $ref: '#/components/parameters/RunId'
    post:
      operationId: pauseRun
      summary: Pause unfinished work with a durable checkpoint
      description: No body or Idempotency-Key required; body is ignored. Pause revokes the current lease and results, then cooperatively stops old executions after commit. Repeated pause while PAUSED is a no-op. A pause arriving after an intervening resume is a new pause request. Deadline continues while paused; discovering expiry commits TIMEOUT before 409. Terminal states reject either operation.
      responses:
        '200':
          description: Current Run after the operation or an unchanged repeat
          headers:
            Nexus-API-Contract:
              required: true
              schema:
                const: '0.4'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Terminal Run, expired deadline, or mismatched Pause-Checkpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseConflictError'
  /v1/runs/{run_id}/resume:
    parameters:
    - $ref: '#/components/parameters/RunId'
    post:
      operationId: resumeRun
      summary: Resume only unfinished work from the latest checkpoint
      description: No body or Idempotency-Key required; body is ignored. Optional Pause-Checkpoint binds a retry to that cycle; mismatches conflict. Without it a delayed request may target a later pause. Repeated resume while active is a no-op. Interrupted Task restarts from its beginning on a new attempt; already consumed attempts are not refunded. If exhausted, return 200 FAILED without execution. Deadline continues while paused; discovering expiry commits TIMEOUT before 409. Terminal states reject either operation.
      responses:
        '200':
          description: Current Run after the operation or an unchanged repeat
          headers:
            Nexus-API-Contract:
              required: true
              schema:
                const: '0.4'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Terminal Run, expired deadline, or mismatched Pause-Checkpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseConflictError'
      parameters:
      - name: Pause-Checkpoint
        in: header
        required: false
        description: Opaque latest checkpoint_id; equality checked, including on active-state repeats.
        schema:
          type: string
  /v1/runs/{run_id}/timeline:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRunTimeline
      summary: Get the ordered immutable domain-event timeline
      responses:
        "200":
          description: Events ordered by their database sequence
          headers:
            Nexus-API-Contract:
              description: Explicit representation revision; no legacy negotiation is supported.
              required: true
              schema:
                const: "0.4"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '[^\x00-\x20]'
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Missing/blank/overlong Idempotency-Key, missing/blank fields, or unreadable JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidRequestError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
  schemas:
    Session:
      type: object
      required: [session_id, created_at]
      properties:
        session_id:
          type: string
        created_at:
          type: string
          format: date-time
    CreateRunRequest:
      type: object
      description: Unknown fields are accepted and ignored, including for idempotency comparison. Strings are not trimmed.
      additionalProperties: true
      required: [session_id, input]
      properties:
        session_id:
          type: string
          minLength: 1
          pattern: '[^\x00-\x20]'
        input:
          type: string
          minLength: 1
          pattern: '[^\x00-\x20]'
        deadline_at:
          description: Optional absolute RFC 3339 offset timestamp (seconds required, at most nine fractional digits, local input years 0001–9999; Z or numeric offsets from -23:59 through +23:59 with minutes 00–59). UTC normalization may cross into year 0000 or 10000. Null/omission means no deadline. Normalized to UTC microseconds; first creation requires a future value, same-request replay remains valid after expiry.
          type: [string, "null"]
          format: date-time
          pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?(?:[Zz]|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$'
    AcceptedRun:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string
    RunStatus:
      type: string
      enum: [CREATED, QUEUED, RUNNING, PAUSED, SUCCEEDED, FAILED, CANCELLED, TIMEOUT]
    TaskStatus:
      type: string
      enum: [PENDING, LEASED, EXECUTING, RETRYING, PAUSED, SUCCEEDED, FAILED, CANCELLED, TIMEOUT]
    Task:
      type: object
      required: [task_id, name, status, input, attempt, max_attempts, next_attempt_at, created_at, updated_at]
      allOf:
        - if:
            properties:
              status: {const: PAUSED}
          then:
            required: [checkpoint]
            properties:
              checkpoint:
                properties:
                  consumed_at: false
                  disposition: false
          else:
            properties:
              checkpoint:
                required: [consumed_at, disposition]
        - if:
            properties:
              status:
                const: TIMEOUT
          then:
            required: [deadline_at]
        - if:
            properties:
              status:
                const: SUCCEEDED
          then:
            required: [output]
          else:
            properties:
              output: false
        - if:
            properties:
              status:
                enum: [LEASED, EXECUTING]
          then:
            required: [lease_owner, lease_expires_at]
          else:
            properties:
              lease_owner: false
              lease_expires_at: false
        - if:
            properties:
              status:
                const: CANCELLED
          then:
            not:
              anyOf:
                - required: [output]
                - required: [lease_owner]
                - required: [lease_expires_at]
      properties:
        checkpoint:
          $ref: "#/components/schemas/PauseCheckpoint"
        task_id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        input:
          type: object
          required: [input]
          properties:
            input:
              type: string
        output:
          description: Omitted until success; never null.
          $ref: "#/components/schemas/Output"
        lease_owner:
          description: Present only while LEASED or EXECUTING; otherwise omitted, never null.
          type: string
        lease_expires_at:
          type: string
          format: date-time
        attempt:
          description: Total lease claims, including the initial attempt.
          type: integer
          minimum: 0
        max_attempts:
          description: Maximum total attempts, including the initial attempt (default 3).
          type: integer
          minimum: 1
        next_attempt_at:
          description: Always present. A RETRYING Task cannot be leased before this time.
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deadline_at:
          description: Persisted absolute deadline, omitted when unlimited. Normally rendered in UTC; boundary instants in UTC year 0000 or 10000 use +23:59 or -23:59 to keep a four-digit local year. Task and Run share this value.
          type: string
          format: date-time
    Run:
      type: object
      required: [run_id, session_id, input, status, tasks, created_at, updated_at]
      allOf:
        - if:
            properties:
              status: {const: PAUSED}
          then:
            properties:
              tasks:
                items:
                  properties:
                    status: {const: PAUSED}
        - if:
            properties:
              status:
                const: TIMEOUT
          then:
            required: [deadline_at]
        - if:
            properties:
              status:
                const: SUCCEEDED
          then:
            required: [output]
          else:
            properties:
              output: false
        - if:
            properties:
              status:
                const: CANCELLED
          then:
            not:
              required: [output]
      properties:
        run_id:
          type: string
        session_id:
          type: string
        input:
          type: string
        status:
          $ref: "#/components/schemas/RunStatus"
        output:
          description: Omitted until success; never null.
          $ref: "#/components/schemas/Output"
        tasks:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/Task"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deadline_at:
          description: Persisted absolute deadline, omitted when unlimited. Normally rendered in UTC; boundary instants in UTC year 0000 or 10000 use +23:59 or -23:59 to keep a four-digit local year. Task and Run share this value.
          type: string
          format: date-time
    PauseCheckpoint:
      type: object
      required:
      - schema_version
      - checkpoint_id
      - task_id
      - run_id
      - run_status
      - task_status
      - attempt
      - task_version
      - run_version
      - next_attempt_at
      - paused_at
      properties:
        schema_version:
          const: 1
        checkpoint_id:
          type: string
          format: uuid
        task_id:
          type: string
        run_id:
          type: string
        run_status:
          enum:
          - QUEUED
          - RUNNING
        task_status:
          enum:
          - PENDING
          - LEASED
          - EXECUTING
          - RETRYING
        attempt:
          type: integer
          minimum: 0
        task_version:
          type: integer
          minimum: 0
        run_version:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        paused_at:
          type: string
          format: date-time
        consumed_at:
          type: string
          format: date-time
        disposition:
          enum:
          - RESUMED
          - ATTEMPTS_EXHAUSTED
          - CANCELLED
          - TIMEOUT
      dependentRequired:
        consumed_at:
        - disposition
        disposition:
        - consumed_at
    Output:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
    DomainEvent:
      description: No schema_version selects frozen 0.1; explicit 0.2, 0.3 or 0.4 selects its schema. Unknown versions are rejected.
      if:
        required: [schema_version]
      then:
        oneOf:
          - $ref: "./events/domain-event-v0.2.schema.json"
          - $ref: "./events/domain-event-v0.3.schema.json"
          - $ref: "./events/domain-event-v0.4.schema.json"
      else:
        $ref: "./events/domain-event.schema.json"
    Timeline:
      type: object
      required: [run_id, events]
      properties:
        run_id:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/DomainEvent"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, not_found, idempotency_conflict, cancellation_conflict, pause_conflict]
        message:
          type: string
    InvalidRequestError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            code:
              const: invalid_request
    NotFoundError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            code:
              const: not_found
    ConflictError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            code:
              const: idempotency_conflict
    CancellationConflictError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            code:
              const: cancellation_conflict
    PauseConflictError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - properties:
            code:
              const: pause_conflict
