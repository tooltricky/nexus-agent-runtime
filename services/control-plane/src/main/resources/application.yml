spring:
  application:
    name: nexus-control-plane
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DB_USERNAME:nexus}
    password: ${DB_PASSWORD:nexus}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

nexus:
  timeout:
    enabled: ${DEADLINE_WATCHDOG_ENABLED:true}
    poll-delay-ms: ${DEADLINE_WATCHDOG_POLL_DELAY_MS:1000}
    batch-size: ${DEADLINE_WATCHDOG_BATCH_SIZE:50}
  watchdog:
    enabled: ${LEASE_WATCHDOG_ENABLED:true}
  worker:
    enabled: ${FAKE_WORKER_ENABLED:true}
    poll-delay-ms: ${FAKE_WORKER_POLL_DELAY_MS:200}
    lease-duration-ms: ${FAKE_WORKER_LEASE_DURATION_MS:30000}
    heartbeat-interval-ms: ${FAKE_WORKER_HEARTBEAT_INTERVAL_MS:10000}
    execution-concurrency: ${FAKE_WORKER_EXECUTION_CONCURRENCY:16}
    watchdog-poll-delay-ms: ${LEASE_WATCHDOG_POLL_DELAY_MS:1000}
    watchdog-batch-size: ${LEASE_WATCHDOG_BATCH_SIZE:50}
    dispatch-retry-delay-ms: ${FAKE_WORKER_DISPATCH_RETRY_DELAY_MS:200}
    retry-initial-delay-ms: ${FAKE_WORKER_RETRY_INITIAL_DELAY_MS:1000}
    retry-max-delay-ms: ${FAKE_WORKER_RETRY_MAX_DELAY_MS:30000}
