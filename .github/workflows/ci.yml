name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose -f deploy/docker-compose.test.yml config --quiet

      - name: Test report checker unit tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Run build and PostgreSQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          # A fresh runner has no previous reports; Maven runs inside the Java 21 container.
          docker compose -f deploy/docker-compose.test.yml up \
            --abort-on-container-exit --exit-code-from tests 2>&1 | tee ci-compose.log

      - name: Require all test suites to execute without skips
        if: always()
        run: |
          python3 scripts/check-test-reports.py \
            --reports-dir services/control-plane/target/surefire-reports

      - name: Collect container logs
        if: always()
        run: docker compose -f deploy/docker-compose.test.yml logs --no-color > ci-container.log 2>&1

      - name: Clean up test containers and network
        if: always()
        run: docker compose -f deploy/docker-compose.test.yml down --remove-orphans

      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-compose.log
            ci-container.log
            services/control-plane/target/surefire-reports/
          if-no-files-found: error
          retention-days: 7
